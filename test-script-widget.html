<!DOCTYPE html>
<html>
<head>
    <title>IFrame Widget Test</title>
</head>
<body>
    <h1>Testing IFrame Widget with Script Content</h1>
    
    <div style="width: 100%; height: 400px; border: 1px solid #ccc;">
        <script src="https://widgets.coingecko.com/gecko-coin-heatmap-widget.js"></script>
        <gecko-coin-heatmap-widget locale="en" dark-mode="true" transparent-background="true" top="15"></gecko-coin-heatmap-widget>
    </div>
    
    <p>This is a test to see if the script-based widget works when embedded directly in HTML.</p>
</body>
</html>
