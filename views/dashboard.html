<style>
  .dashboard-wrap { display:flex; flex-direction:column; height:100%; min-height:0; }
  #dashGrid, .dashGrid { flex:1; min-height: 0; grid-template-rows: 1fr; position: relative; }
  #dashGrid .card, .dashGrid .card { height: 90%; }
  /* Ensure some extra space at the bottom of widgets to visually match top padding */
  #dashGrid .card, .dashGrid .card { padding-bottom: 0px; }
  #dashHeader { position: relative; z-index: 10000; }
  /* Show slot boxes during edit mode */
  #dashGrid .slot-outline, .dashGrid .slot-outline {
    border: 2px dashed rgba(255,255,255,0.18);
    border-radius: 5px;
    height: 100%;
  }
  #dashGrid .slot-outline.slot-empty, .dashGrid .slot-outline.slot-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    line-height: 1;
    color: rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.03);
  }
 
  /* Dragging visual indicator */
  #dashGrid.is-dragging, .dashGrid.is-dragging { position: relative; }
  #dashGrid.is-dragging::after, .dashGrid.is-dragging::after {
    content: 'Moving widget';
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.9);
    background: rgba(77,163,255,0.18);
    border: 1px solid rgba(77,163,255,0.55);
    pointer-events: none;
    z-index: 50;
  }
  #dashGrid.is-dragging .card, .dashGrid.is-dragging .card { opacity: 0.65; transition: opacity 80ms ease, transform 80ms ease; }
  #dashGrid.is-dragging .card.dragging, .dashGrid.is-dragging .card.dragging { opacity: 0.35; transform: scale(0.98); }
  /* Larger edit controls */
  .edit-ctrls { user-select: none; }
  .edit-btn {
    font-size: 16px;
    padding: 10px 14px;
    min-height: 40px;
    min-width: 40px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.95);
    cursor: pointer;
  }
  .edit-btn:active { transform: translateY(1px); }
 
  /* Make cards a flex column and allow children to shrink */
#dashGrid .card, .dashGrid .card {
  display: flex;
  flex-direction: column;
  min-height: 0;        /* IMPORTANT for nested flex/grids */
  overflow: hidden;     /* optional, keeps rounded corners tidy */
}

/* The immediate body that widgets render into should flex */
#dashGrid .card > div, .dashGrid .card > div {
  flex: 1 1 auto;
  min-height: 0;        /* prevents half-render when content is larger */
}

 
</style>
<div class="dashboard-wrap">
  <div class="card" id="dashHeader" style="margin-bottom: 8px;">
    <div class="row" style="align-items:center; justify-content:space-between;">
      <div class="title">Dashboard</div>
      <div class="row" id="dashControls" style="gap:8px;">
        <div style="width:12px;"></div>
        <button class="small-btn" id="dashPagePrev" onclick="window.dashPagePrev && window.dashPagePrev()" title="Previous Page">&larr;</button>
        <div class="pill" id="dashPageLabel">Page 1 / 1</div>
        <button class="small-btn" id="dashPageNext" onclick="window.dashPageNext && window.dashPageNext()" title="Next Page">&rarr;</button>
        <div id="dashPageDots" style="display:flex;gap:4px;align-items:center;"></div>
        <button class="small-btn" id="dashPageAdd" onclick="window.dashPageAdd && window.dashPageAdd()" title="Add Page">+</button>
        <button class="small-btn" id="dashPageRemove" onclick="window.dashPageRemove && window.dashPageRemove()" title="Remove Current Page">-</button>
        <div style="width:12px;"></div>
        <button class="small-btn" id="dashColsDec" onclick="window.dashColsDec && window.dashColsDec()">- Col</button>
        <div class="pill" id="dashColsLabel">3 cols</div>
        <button class="small-btn" id="dashColsInc" onclick="window.dashColsInc && window.dashColsInc()">+ Col</button>
        <div style="width:12px;"></div>
        <button class="small-btn" id="dashToggleSplit" onclick="window.dashToggleSplit && window.dashToggleSplit()">Split: Off</button>
        <button class="small-btn" id="dashToggleEdit" onclick="window.dashToggleEdit && window.dashToggleEdit()">Edit: Off</button>
      </div>
    </div>
    <div class="sub">Configure pages and widgets. Changes are saved to config.json.</div>
    </div>

  <div id="dashGrid" class="grid"></div>
</div>
